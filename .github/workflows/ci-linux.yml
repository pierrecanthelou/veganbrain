# CI Linux (tâche 11, docs/suivi.md) : à chaque PR et à chaque push sur main.
# - scan : gitleaks sur tout l'historique, précédé d'un témoin qui prouve que le scan échoue sur un jeton.
# - tests : jvmTest (LIS-08, A11-01), build Android, puis sur émulateur les tests instrumentés (A11-08)
#   et le flux Maestro du spike (spikes/maestro/flows/onglets.yaml).
#
# Aucun secret n'est utilisé : le build compile sans l'adresse de contact OFF (contact@exemple.invalid
# par défaut, shared/build.gradle.kts). Le déclencheur est `pull_request`, jamais `pull_request_target` :
# sur une PR venant d'un fork, GitHub ne passe aucun secret hors GITHUB_TOKEN, en lecture seule
# (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows).
#
# Actions épinglées par empreinte de commit, version en commentaire (empreintes lues le 2026-11-27
# par l'API GitHub, refs/tags).

name: CI Linux

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan de secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tout l'historique, pour scanner chaque commit
          persist-credentials: false
      - name: Gitleaks (témoin puis dépôt)
        run: bash scripts/ci/scanner-secrets.sh

  tests:
    name: Tests JVM, build Android, émulateur
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # jvmToolchain(17) sans résolveur de toolchain (docs/suivi.md, tâche 8) : le JDK 17 vient d'ici.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      # Cache `basic` : implémentation MIT ; le cache par défaut (`enhanced`) est propriétaire
      # (https://github.com/gradle/actions/blob/v6.4.1/DISTRIBUTION.md). La validation du wrapper
      # est faite par défaut (docs/setup-gradle.md, « Gradle Wrapper validation »).
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Tests JVM et build Android
        run: ./gradlew :shared:jvmTest :androidApp:assembleDebug

      - name: Installation de Maestro
        run: bash scripts/ci/installer-maestro.sh

      # Étape reprise du README de l'action (« Enable KVM group perms »).
      - name: Activation de KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Diagnostic : ressources du runner et droits sur /dev/kvm (le premier run est resté
      # « device offline » 10 minutes sans dire si KVM servait). `emulator -accel-check` vient après
      # l'émulateur : le binaire n'est pas sur l'image du runner, l'action l'installe.
      - name: Diagnostic de l'accélération
        run: |
          nproc
          free -m
          df -h /
          ls -l /dev/kvm

      # Image google_apis et non google_apis_playstore comme l'AVD du spike : plus légère, et ni
      # ThemeSystemeTest ni le flux onglets n'ont besoin de Play. Les deux images existent en 36.1 x86_64
      # (sys-img2-4.xml de Google). `-show-kernel` montre où le démarrage s'arrête, à retirer une fois au vert.
      # `ram-size` explicite : sans lui, l'AVD créé par l'action démarrait avec 96 Mo de mémoire, d'où un
      # OOM d'init, une panique du noyau et un redémarrage en boucle. Le runner a 4 cœurs et 15,7 Go (diagnostic).
      # `disk-size` aussi : la partition de données par défaut ne laissait pas installer l'APK de 12 Mo
      # (« Requested internal only, but not enough space »).
      # `emulator-build` : émulateur 36.4.9 (build 14788078), celui du poste où ces tests passent. Avec le 37.3.10
      # installé par défaut, surfaceflinger s'arrêtait toutes les 20 à 26 s sur « Assertion failed:
      # !rcEnc->featureInfo()->hasReadColorBufferDma » (mapper.ranchu.so, logcat crash), ce qui relançait
      # zygote et cassait l'installation de l'APK puis le lancement de l'activité de test.
      # `script` : l'action lance chaque ligne dans un `sh -c` séparé (src/script-parser.ts), d'où un seul script.
      - name: Tests sur émulateur
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: '36.1'
          emulator-build: '14788078'
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -show-kernel
          script: bash scripts/ci/tests-emulateur.sh

      - name: Accélération vue par l'émulateur
        if: ${{ !cancelled() }}
        run: '"$ANDROID_HOME/emulator/emulator" -accel-check || true'

      - name: Résumé des tests
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/resume-tests.py

      - name: Rapports de tests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapports-tests
          path: |
            shared/build/test-results/jvmTest/
            androidApp/build/outputs/androidTest-results/connected/
            build/maestro/
            build/emulateur/
          if-no-files-found: warn
