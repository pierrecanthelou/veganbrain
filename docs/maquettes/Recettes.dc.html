<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nos recettes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
body{margin:0}
a{color:#1F3A2B}a:hover{color:#2F6B4A}
@keyframes capsule-in{from{left:0px;background:#F8D3B0}to{left:140px;background:#E3DAF8}}
@keyframes rond-in{from{background:#EE9048}to{background:#B197E6}}
@keyframes piste-in{from{background:rgba(177, 151, 230, 0.18)}to{background:rgba(238, 144, 72, 0.16)}}
.capsule{animation:capsule-in .45s cubic-bezier(.3,.7,.2,1) both}
.rond{animation:rond-in .45s ease both}
.piste{animation:piste-in .45s ease both}
@media (prefers-reduced-motion: reduce){.capsule,.rond,.piste{animation:none}}
.filtre{background:rgba(31,58,43,.07);color:#4A6553;transition:background-color .22s ease,color .22s ease,transform .15s ease}
.filtre:active{transform:scale(.95)}
.filtre.on{color:#1F3A2B}
.filtre.on.f-toutes{background:#A8D5B0}.filtre.on.f-super{background:#7BC59B}.filtre.on.f-bon{background:#D9EFC4}.filtre.on.f-pas{background:#F1C4B6}
@media (prefers-reduced-motion: reduce){.filtre,.note,.seg{transition:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; isolation: isolate; background: radial-gradient(470px 380px at 100% 100%, rgba(155, 120, 235, 0.42) 0%, rgba(155, 120, 235, 0) 65%), radial-gradient(100% 45% at 0% 0%, rgba(168, 213, 176, 0.55) 0%, rgba(168, 213, 176, 0) 70%), linear-gradient(180deg, #F0F8EE 0%, #E3F1E4 100%); color: #1F3A2B; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<header style="position: absolute; z-index: 2; left: 0; top: 0; width: 390px; box-sizing: border-box; padding: 20px 20px 16px; background: rgba(251, 253, 250, 0.6); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-bottom: 1px solid #B5CFB8; box-shadow: 0 1px 0 #FBFDFA; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 30px; line-height: 40px; font-weight: 700; letter-spacing: -0.5px">Nos recettes</h1>
<div aria-hidden="true" style="width: 36px; height: 5px; border-radius: 3px; background: #B197E6"></div>
</div>
<label style="display: flex; align-items: center; gap: 10px; height: 48px; box-sizing: border-box; padding: 0 14px; background: #FBFDFA; border: 1px solid #B5CFB8; border-radius: 12px">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A6553" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Chercher une recette</span>
<input type="search" placeholder="Chercher une recette" style="flex-grow: 1; min-width: 0; height: 44px; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 15px; color: #1F3A2B">
</label>
<div style="display: flex; gap: 8px">
<sc-for list="{{chips}}" as="chip" hint-placeholder-count="4">
<button type="button" aria-pressed="{{chip.on}}" onClick="{{chip.pick}}" class="{{chip.cls}}" style="height: 44px; padding: 0 12px; border: 0; border-radius: 22px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px"><sc-if value="{{chip.isSuper}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.2 4.1 1 5.8L12 16.9 6.7 19.6l1-5.8L3.5 9.7l5.9-.9z"></path></svg></sc-if><sc-if value="{{chip.isBon}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if><sc-if value="{{chip.isPas}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></sc-if><span>{{chip.label}}</span></button>
</sc-for>
</div>
</header>
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; box-sizing: border-box; overflow-y: auto; padding: 214px 20px 124px; -webkit-mask-image: linear-gradient(180deg, #000 0, #000 calc(100% - 120px), rgba(0, 0, 0, 0) calc(100% - 82px)); mask-image: linear-gradient(180deg, #000 0, #000 calc(100% - 120px), rgba(0, 0, 0, 0) calc(100% - 82px))">
<sc-for list="{{items}}" as="item" hint-placeholder-count="5">
<a href="Recette.dc.html" style="display: flex; align-items: center; gap: 12px; height: 76px; box-sizing: border-box; border-bottom: 1px solid #FBFDFA; box-shadow: inset 0 -1px 0 #B5CFB8; text-decoration: none; color: #1F3A2B">
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 15px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{item.name}}</div>
<div style="display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 18px; color: #4A6553">
<sc-if value="{{item.isInsta}}" hint-placeholder-val="{{false}}">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>
</sc-if>
<sc-if value="{{item.isLivre}}" hint-placeholder-val="{{true}}">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h10a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"></path><path d="M5 17a3 3 0 0 1 3-3h10"></path></svg>
</sc-if>
<sc-if value="{{item.isAdapt}}" hint-placeholder-val="{{false}}">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"></path></svg>
</sc-if>
<span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{item.meta}}</span>
</div>
</div>
<sc-if value="{{item.isSuper}}" hint-placeholder-val="{{true}}">
<div role="img" aria-label="Super" style="flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; box-sizing: border-box; border-radius: 18px; background: #7BC59B; color: #1F3A2B">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.2 4.1 1 5.8L12 16.9 6.7 19.6l1-5.8L3.5 9.7l5.9-.9z"></path></svg>
</div>
</sc-if>
<sc-if value="{{item.isBon}}" hint-placeholder-val="{{false}}">
<div role="img" aria-label="Bon" style="flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; box-sizing: border-box; border-radius: 18px; background: #D9EFC4; color: #1F3A2B">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</div>
</sc-if>
<sc-if value="{{item.isPas}}" hint-placeholder-val="{{false}}">
<div role="img" aria-label="Pas bon" style="flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; box-sizing: border-box; border-radius: 18px; background: #F1C4B6; color: #1F3A2B">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</div>
</sc-if>
</a>
</sc-for>
</div>
<nav aria-label="Navigation principale" style="position: absolute; z-index: 2; left: 25px; bottom: 31px; width: 340px; height: 48px; display: flex; align-items: center; justify-content: space-between">
<div class="piste" style="position: absolute; left: 0; top: 0; width: 340px; height: 48px; border-radius: 24px; background: rgba(238, 144, 72, 0.16)"></div>
<div class="capsule" style="position: absolute; left: 140px; top: 0; width: 200px; height: 48px; border-radius: 24px; background: #E3DAF8"></div>
<a href="Main.dc.html" style="position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; width: 132px; height: 48px; text-decoration: none; color: #4A6553; font-size: 14px; font-weight: 500">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8l8-4 8 4v8l-8 4-8-4z"></path><path d="M4 8l8 4 8-4M12 12v8"></path></svg>
<span>Produits</span>
</a>
<a href="Recettes.dc.html" aria-current="page" style="position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; width: 132px; height: 48px; text-decoration: none; color: #1F3A2B; font-size: 14px; font-weight: 600">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16a8 8 0 0 1-16 0z"></path><path d="M9 4c0 1.5 1 1.5 1 3M14 4c0 1.5 1 1.5 1 3"></path></svg>
<span>Recettes</span>
</a>
<a class="rond" href="Recette.dc.html" aria-label="Ajouter une recette" style="position: absolute; left: 140px; top: -6px; display: flex; align-items: center; justify-content: center; width: 60px; height: 60px; border-radius: 30px; background: #B197E6; color: #1F3A2B">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const filter = (this.state && this.state.filter) || 'toutes';
    const all = [
      { name: 'Blanquette de seitan', meta: 'Adaptée · blanquette de famille', src: 'adapt', note: 'super' },
      { name: 'Dahl de lentilles corail', meta: 'Livre · page 84', src: 'livre', note: 'super' },
      { name: 'Cookies tahini chocolat', meta: 'Insta · lien enregistré', src: 'insta', note: 'bon' },
      { name: 'Lasagnes aux lentilles', meta: 'Adaptée · recette traditionnelle', src: 'adapt', note: 'bon' },
      { name: 'Tofu brouillé', meta: 'Livre · page 23', src: 'livre', note: 'pas' },
      { name: 'Mousse au chocolat à l’aquafaba', meta: 'Insta · lien enregistré', src: 'insta', note: 'super' },
      { name: 'Curry de pois chiches', meta: 'Livre · page 112', src: 'livre', note: 'super' },
      { name: 'Burgers maison, sauce au poivre', meta: 'Adaptée · recette traditionnelle', src: 'adapt', note: 'bon' },
      { name: 'Quiche aux poireaux sans œuf', meta: 'Adaptée · recette traditionnelle', src: 'adapt', note: 'bon' },
      { name: 'Banana bread', meta: 'Insta · lien enregistré', src: 'insta', note: 'bon' },
      { name: 'Bourguignon de champignons', meta: 'Adaptée · bœuf bourguignon', src: 'adapt', note: 'super' },
      { name: 'Crêpes sans œuf', meta: 'Adaptée · recette de famille', src: 'adapt', note: 'pas' },
      { name: 'Houmous de betterave', meta: 'Livre · page 37', src: 'livre', note: 'bon' }
    ];
    const items = all
      .filter((r) => filter === 'toutes' || r.note === filter)
      .map((r) => ({
        ...r,
        isInsta: r.src === 'insta', isLivre: r.src === 'livre', isAdapt: r.src === 'adapt',
        isSuper: r.note === 'super', isBon: r.note === 'bon', isPas: r.note === 'pas'
      }));
    const chips = [
      { id: 'toutes', label: 'Toutes' },
      { id: 'super', label: 'Super' },
      { id: 'bon', label: 'Bon' },
      { id: 'pas', label: 'Pas bon' }
    ].map((c) => ({ ...c, isSuper: c.id === 'super', isBon: c.id === 'bon', isPas: c.id === 'pas', cls: 'filtre f-' + c.id + (c.id === filter ? ' on' : ''), on: c.id === filter, pick: () => this.setState({ filter: c.id }) }));
    return { items, chips };
  }
}
</script>
</body>
</html>
